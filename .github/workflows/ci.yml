name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt
      - run: python -m pytest -q
        env:
          DEBUG: "True"
          GROQ_API_KEY: ""
      - run: docker build -f Dockerfile.backend -t instant-mechanic-backend:ci .
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run Gradle tests
        working-directory: dispatch-service
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon --console=plain
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env is gitignored; seed the tracked template so Compose can validate.
      - run: cp .env.example .env
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
