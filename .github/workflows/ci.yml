name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt
      - run: python -m pytest -q
        env:
          DEBUG: "True"
          GROQ_API_KEY: ""
      - run: docker build -f Dockerfile.backend -t instant-mechanic-backend:ci .
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SAST and dependency-audit tools
        run: python -m pip install bandit pip-audit
      - name: Bandit SAST (medium and above)
        run: bandit -r backend/app -ll -x backend/app/tests
      # --no-deps + --disable-pip: all pins are exact, and +CPU wheels are not
      # resolvable from the default index. Audit the pinned set itself.
      - name: pip-audit (Python CVEs)
        run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - name: Build backend image for Trivy
        run: docker build -f Dockerfile.backend -t instant-mechanic-backend:security .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: instant-mechanic-backend:security
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Unfixable distro/kernel CVEs are reported in the job log but do
          # not block; fixable HIGH/CRITICAL findings still fail the build.
          ignore-unfixed: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
