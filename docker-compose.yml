services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DATABASE_URL: sqlite+aiosqlite:////data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sqlite-data:
